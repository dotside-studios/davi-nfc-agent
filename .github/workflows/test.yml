name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Install PC/SC library
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned rather than `latest`: the version must be built with a Go
          # release at least as new as the `go` directive in go.mod, or it
          # refuses to load the package graph at all.
          version: v2.5.0
          # The default caps (50 per linter, 3 per identical message) hide
          # repeat offenders; report every issue so regressions are visible.
          args: --timeout=5m --max-issues-per-linter=0 --max-same-issues=0

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Install PC/SC library
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev

      - name: Run tests
        run: go test -shuffle=on -v ./...

      - name: Run tests with race detector
        run: go test -race -shuffle=on -v ./...

      - name: Run tests with coverage
        run: go test -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  vuln:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Install PC/SC library
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
