name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned rather than `latest`: the version must be built with a Go
          # release at least as new as the `go` directive in go.mod, or it
          # refuses to load the package graph at all.
          version: v2.5.0
          # The default caps (50 per linter, 3 per identical message) hide
          # repeat offenders; report every issue so regressions are visible.
          args: --timeout=5m --max-issues-per-linter=0 --max-same-issues=0

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Run tests
        run: go test -shuffle=on -v ./...

      - name: Run tests with race detector
        run: go test -race -shuffle=on -v ./...

      - name: Run tests with coverage
        run: go test -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  vuln:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cgopcsc:
    # The -tags cgopcsc fallback still links libpcsclite; keep it compiling.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Install PC/SC development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev

      - name: Build and test with the ebfe/scard backend
        run: |
          go build -tags cgopcsc ./...
          go vet -tags cgopcsc ./...
          go test -tags cgopcsc -shuffle=on ./nfc/...

  crosscompile:
    # Only the release workflow builds the non-Linux targets, and only on a tag,
    # so a platform-specific compile error can otherwise reach master unseen.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Build every release target
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null .
          done

      - name: Build the macOS packages
        # The agent itself needs cgo on darwin (fyne.io/systray talks to Cocoa),
        # which an Ubuntu runner cannot do; everything below the systray can
        # still be type-checked here.
        env:
          CGO_ENABLED: '0'
        run: |
          for arch in amd64 arm64; do
            echo "== darwin/$arch"
            GOOS=darwin GOARCH=$arch go build ./nfc/... ./server/... ./tls/... ./protocol/...
          done

  web:
    # The client library and the console that consumes it. Both build outputs
    # are committed -- client/dist for a page with no build step, the console's
    # dist for `go build .` without Node -- so this also checks that what is in
    # the tree is what the current source produces.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Client library
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Control center
        working-directory: webui/frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Committed build output is current
        run: |
          if ! git diff --quiet -- client/dist webui/frontend/dist; then
            echo "::error::client/dist or webui/frontend/dist is stale."
            echo "Run 'make client' and 'make webui', then commit the result."
            git --no-pager diff --stat -- client/dist webui/frontend/dist
            exit 1
          fi
